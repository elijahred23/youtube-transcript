apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-transcript-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: youtube-transcript-api
  template:
    metadata:
      labels:
        app: youtube-transcript-api
    spec:
      containers:
        - name: youtube-transcript-api
          image: elijahred23/youtube-transcript-api:latest   # CICD updates this
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: youtube-transcript-api
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5002
  selector:
    app: youtube-transcript-api
