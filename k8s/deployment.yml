apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-transcript-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: youtube-transcript-api
  template:
    metadata:
      labels:
        app: youtube-transcript-api
    spec:
      containers:
        - name: youtube-transcript-api
          image: elijahred23/youtube-transcript-api:latest   # CICD updates this
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: youtube-transcript-api
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5002
  selector:
    app: youtube-transcript-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
